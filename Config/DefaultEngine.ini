[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
; The game mode (LRCoreGameMode.h): the game on the rewrite's core.
GlobalDefaultGameMode=/Script/LegoRacers.LRCoreGameMode

[/Script/Engine.RendererSettings]
; The original is unlit and baked: present it 1:1 (no auto exposure/bloom/blur/AO, no temporal AA
; smearing), and skip GI/reflections it never had.
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.Bloom=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False
r.DefaultFeature.AmbientOcclusion=False
r.AntiAliasingMethod=1
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
; Fewer shader permutations (faster compiles): nothing is baked, so no lightmap variants.
r.AllowStaticLighting=False

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
; The desktop's shader model (the Thor's: Config/LinuxArm64/).
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6
; 4 x 1024-frame device buffers (default 2): absorbs PulseAudio/PipeWire scheduling jitter (the
; game's sound skipped with 2).
AudioNumBuffersToEnqueue=4

[Audio]
; Keep playing when the window loses focus (alt-tab), as the original did; UE's default mutes it.
UnfocusedVolumeMultiplier=1.0


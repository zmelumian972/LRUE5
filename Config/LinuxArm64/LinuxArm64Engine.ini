; LinuxArm64 = the AYN Thor build (Adreno 740 on Turnip): Shader Model 5.
; Layered over DefaultEngine.ini on LinuxArm64 only. The cook's targeted RHIs come from the host's config, so
; a Thor build overrides those on the cooker's command line.

; The game's own RHI list at runtime: SM5 only. Without this it inherits Default's SM6-only list and quits
; on the Adreno 740 ("Vulkan device could not be created at the project's supported feature levels").
[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM6
+TargetedRHIs=SF_VULKAN_SM5
